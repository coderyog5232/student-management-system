<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2>🎓 EduManage</h2>
        <ul>
            <li>Dashboard</li>
            <li>Students</li>
            <li>Courses</li>
            <li>Settings</li>
        </ul>
    </aside>

    <main class="main">

        <header>
            <div>
                <h1>Student Dashboard</h1>
                <p>Manage your student records easily.</p>
            </div>
            <button onclick="openForm()">+ Add Student</button>
        </header>

        <section class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Active Students</h3>
                <h2 id="activeStudents">0</h2>
            </div>

            <div class="card">
                <h3>Inactive Students</h3>
                <h2 id="inactiveStudents">0</h2>
            </div>

        </section>

        <section class="student-section">

            <h2>Student Records</h2>

            <input
                type="text"
                id="search"
                placeholder="Search student..."
                oninput="displayStudents()"
            >

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable"></tbody>

                </table>
            </div>

        </section>

    </main>
</div>

<!-- Student Form -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <h2 id="formTitle">Add Student</h2>

        <input type="text" id="name" placeholder="Student Name">

        <input type="email" id="email" placeholder="Email Address">

        <input type="text" id="course" placeholder="Course Name">

        <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button onclick="saveStudent()">Save Student</button>

        <button class="close" onclick="closeForm()">Cancel</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
